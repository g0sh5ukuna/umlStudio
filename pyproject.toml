[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "umlstudio"
version = "0.1.0"
description = "Outil de validation, traçabilité et reporting pour dossiers de conception logicielle"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Josué SOUNON", email = "183626778+g0sh5ukuna@users.noreply.github.com" }
]
keywords = ["architecture", "conception", "uml", "specifications", "traceability", "validation", "qa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hatchling>=1.21.0",
]

[project.scripts]
umlstudio = "umlstudio.cli:app"
uml-studio = "umlstudio.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/umlstudio"]

[tool.hatch.build.targets.wheel.force-include]
"modeles/conception" = "umlstudio/modeles/conception"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
